<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Увійти або зареєструватися · ProMedia Jobs</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="utility-bar">
  <a class="home-btn" href="https://promedia.report">← ПроМедіа</a>
  <a class="home-btn" href="index.html" style="margin-left:auto">← На головну</a>
</div>

<main class="wrap">
  <div class="auth-card">
    <div class="auth-tabs">
      <button id="tab-login" type="button">Увійти</button>
      <button id="tab-register" type="button">Реєстрація</button>
    </div>

    <div id="pane-login" style="display:none">
      <h1>З поверненням</h1>
      <p class="sub" id="login-sub">Демо-вхід — акаунт не створюється насправді</p>
      <form id="login-form">
        <div class="field"><label>Електронна пошта</label><input type="email" required placeholder="you@example.com" /></div>
        <div class="field"><label>Пароль</label><input type="password" required placeholder="••••••••" /></div>
        <button class="btn btn-primary btn-block" type="button" onclick="completeLogin()">Увійти</button>
      </form>
      <div class="auth-divider">або</div>
      <button class="btn btn-light btn-block btn-google" type="button" onclick="completeGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.04l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
        Увійти через Gmail
      </button>
      <p style="text-align:center;margin-top:16px"><a href="#" style="font-size:13px;color:var(--ink)" onclick="alert('Демо: лист для відновлення пароля не надсилається');return false">Забули пароль?</a></p>
    </div>

    <div id="pane-register">
      <h1>Створити акаунт</h1>
      <p class="sub" id="register-sub">Підтвердження електронної пошти в демо не потрібне</p>
      <form id="register-form">
        <div class="field"><label>Ім'я</label><input type="text" id="reg-name" required placeholder="Ваше ім'я" /></div>
        <div class="field"><label>Електронна пошта</label><input type="email" id="reg-email" required placeholder="you@example.com" /></div>
        <div class="field"><label>Пароль</label><input type="password" required placeholder="Мінімум 8 символів" /></div>
        <div class="field">
          <label>Я реєструюся як</label>
          <select id="reg-role"><option value="candidate">Кандидат — шукаю роботу</option><option value="employer">Роботодавець — шукаю працівників</option></select>
        </div>
        <div class="check-row"><input type="checkbox" required id="consent"><label for="consent">Реєструючись, я погоджуюся з <a href="terms.html#offer" target="_blank">публічною офертою</a>, <a href="terms.html#rules" target="_blank">правилами користування</a> та <a href="privacy.html" target="_blank">обробкою персональних даних</a></label></div>
        <button class="btn btn-primary btn-block" style="margin-top:14px" type="button" onclick="completeRegister()">Зареєструватися</button>
      </form>
      <div class="auth-divider">або</div>
      <button class="btn btn-light btn-block btn-google" type="button" onclick="completeGoogleRegister()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.04l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
        Зареєструватися через Gmail
      </button>
      <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px">Роль для входу через Gmail береться з поля «Я реєструюся як» вище</p>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const tl = document.getElementById("tab-login"), tr = document.getElementById("tab-register");
  const pl = document.getElementById("pane-login"), pr = document.getElementById("pane-register");
  tl.addEventListener("click", () => { tl.classList.add("active"); tr.classList.remove("active"); pl.style.display = ""; pr.style.display = "none"; });
  tr.addEventListener("click", () => { tr.classList.add("active"); tl.classList.remove("active"); pr.style.display = ""; pl.style.display = "none"; });

  const preRole = qs("role"); // 'candidate' | 'employer', якщо прийшли з головної сторінки
  if (preRole === "employer" || preRole === "candidate") {
    document.getElementById("reg-role").value = preRole;
    const roleLabel = preRole === "employer" ? "роботодавця" : "кандидата";
    document.getElementById("register-sub").textContent = `Реєстрація як ${roleLabel} — далі одразу в кабінет`;
    document.getElementById("login-sub").textContent = `Вхід як ${roleLabel}`;
    tr.click(); // нові люди з головної йдуть одразу в реєстрацію
  } else {
    tl.click();
  }

  function redirectAfterAuth(role) {
    setAuthed(true);
    setRole(role);
    location.href = qs("next") || (role === "employer" ? "employer-cabinet.html" : "candidate-cabinet.html");
  }

  function completeLogin() {
    const form = document.getElementById("login-form");
    if (!form.reportValidity()) return;
    redirectAfterAuth(preRole || getRole() || "candidate");
  }

  function completeRegister() {
    const form = document.getElementById("register-form");
    if (!form.reportValidity()) return;
    const role = document.getElementById("reg-role").value;
    setProfile(document.getElementById("reg-name").value, document.getElementById("reg-email").value);
    toast("Демо: акаунт умовно створено");
    setTimeout(() => redirectAfterAuth(role), 500);
  }

  function completeGoogleLogin() {
    toast("Демо: вхід через Gmail умовно виконано");
    setTimeout(() => redirectAfterAuth(preRole || getRole() || "candidate"), 400);
  }

  function completeGoogleRegister() {
    if (!document.getElementById("consent").checked) { toast("Спочатку погодьтеся з обробкою даних"); return; }
    const role = document.getElementById("reg-role").value;
    toast("Демо: акаунт через Gmail умовно створено");
    setTimeout(() => redirectAfterAuth(role), 400);
  }
</script>
</body>
</html>
