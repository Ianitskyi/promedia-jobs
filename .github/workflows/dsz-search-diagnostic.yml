name: DSZ dataset search (diagnostic, manual only)

on:
  workflow_dispatch: {}

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Search data.gov.ua for vacancy-related datasets
        run: node scripts/dsz-search-diagnostic.js
