name: Daily vacancy import

on:
  schedule:
    # 05:00 UTC = 08:00 Київ (літній час) / 07:00 (зимовий)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run import
        run: node scripts/import-dsz-vacancies.js

      - name: Commit and push if changed
        run: |
          git config user.name "promedia-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/imported-vacancies.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily vacancy import $(date -u +%F)"
            git push
          fi
